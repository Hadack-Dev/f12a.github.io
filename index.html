<div style="max-width: 640px; margin: 20px auto; font-family: Verdana, Arial, Helvetica, sans-serif; font-size: 12px; color: #333;">

  <!-- Заголовок блока -->
  <div style="background: #e8e8e8; border: 1px solid #c9c9c9; border-bottom: none; padding: 6px 10px; font-weight: bold; color: #444; font-size: 13px;">
    Важное объявление
  </div>

  <!-- Тело блока -->
  <div style="background: #f7f7f7; border: 1px solid #c9c9c9; padding: 14px 12px; text-align: center; line-height: 1.6;">

    <div style="font-weight: bold; color: #444; margin-bottom: 6px;">
      Этот сайт устарел
    </div>

    <div style="color: #666; margin-bottom: 14px;">
      Мы переехали на новый адрес. Пожалуйста, обновите закладку.<br>
      Для перехода подтвердите, что вы не робот.
    </div>

    <!-- Капча -->
    <div style="margin-bottom: 12px;">
      <span id="captcha-question" style="font-weight: bold; color: #444;"></span>
    </div>

    <div style="margin-bottom: 12px;">
      <input type="text" id="captcha-answer" 
             style="padding: 5px 8px; border: 1px solid #b5b5b5; border-radius: 3px; font-size: 12px; font-family: Verdana, Arial, sans-serif; width: 80px; text-align: center;"
             placeholder="Ответ">
    </div>

    <div id="captcha-error" style="color: #c00; font-size: 12px; margin-bottom: 10px; display: none;">
      Неверный ответ. Попробуйте ещё раз.
    </div>

    <!-- Кнопка -->
    <a href="#" id="go-link"
       style="display: inline-block; padding: 6px 16px; background: #dcdcdc; color: #333; text-decoration: none; border: 1px solid #b5b5b5; border-radius: 3px; font-size: 12px; font-weight: bold;">
      Переходите :)
    </a>

  </div>

</div>

<script>
(function() {
  var a = Math.floor(Math.random() * 9) + 1;
  var b = Math.floor(Math.random() * 9) + 1;
  var correct = a + b;

  document.getElementById('captcha-question').textContent = 'Сколько будет ' + a + ' + ' + b + '?';

  var link = document.getElementById('go-link');
  var input = document.getElementById('captcha-answer');
  var error = document.getElementById('captcha-error');

  link.addEventListener('click', function(e) {
    if (parseInt(input.value, 10) !== correct) {
      e.preventDefault();
      error.style.display = 'block';
      input.value = '';
      input.focus();
    } else {
      error.style.display = 'none';
      window.location.href = 'https://f12a.0pk.me/';
    }
  });
})();
</script>
